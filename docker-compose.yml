services:
  # ── Base de datos geoespacial ──────────────────────────────────────────────
  db:
    image: postgis/postgis:16-3.4
    container_name: dts-postgis
    environment:
      POSTGRES_DB: dts_delivery
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - dts_postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dts_delivery"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dts-backend

  # ── Broker Celery + Channels + cache ───────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: dts-redis
    ports:
      - "6379:6379"
    volumes:
      - dts_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - dts-backend

  # ── Servidor de correo (desarrollo) ────────────────────────────────────────
  # Mailpit captura todos los emails enviados por Django/Celery.
  # UI web: http://localhost:8025
  # SMTP:   localhost:1025 (sin auth, sin TLS)
  mailpit:
    image: axllent/mailpit:latest
    container_name: dts-mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8025"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dts-backend

networks:
  dts-backend:
    driver: bridge

volumes:
  dts_postgis_data:
  dts_redis_data:
