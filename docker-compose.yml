services:
  db:
    image: postgis/postgis:16-3.4
    container_name: dts-postgis
    environment:
      POSTGRES_DB: dts_delivery
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - dts_postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dts_delivery"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: dts-redis
    ports:
      - "6379:6379"
    volumes:
      - dts_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dts_postgis_data:
  dts_redis_data:
