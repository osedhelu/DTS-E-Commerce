# Infraestructura base: PostGIS, Redis y Mailpit.
# Uso desarrollo local: make docker-up (desde raíz del monorepo)

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: dts-postgis
    environment:
      POSTGRES_DB: ${DB_NAME:-dts_delivery}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - dts_postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-dts_delivery}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dts-backend

  redis:
    image: redis:7-alpine
    container_name: dts-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - dts_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - dts-backend

  mailpit:
    image: axllent/mailpit:latest
    container_name: dts-mailpit
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8025"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dts-backend

networks:
  dts-backend:
    driver: bridge

volumes:
  dts_postgis_data:
  dts_redis_data:
