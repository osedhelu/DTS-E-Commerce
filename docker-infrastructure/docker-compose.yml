# Stack completo para servidor local: infra + API Django + Celery worker + Celery beat.
#
# Uso local (PostGIS en Docker):
#   cp docker-infrastructure/.env.example docker-infrastructure/.env
#   make up
#
# Uso con BD externa (Railway, etc.):
#   USE_LOCAL_DB=false
#   DATABASE_URL=postgresql://USER:PASS@HOST:5432/DB_NAME
#   make up
#
# API:     http://localhost:8000
# Mailpit: http://localhost:8025

include:
  - path: docker-compose.infra.yml

x-backend-env: &backend-env
  SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
  DEBUG: ${DEBUG:-False}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,api,extreme.local}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000,http://extreme.local:8000}
  # DATABASE_URL tiene prioridad en Django (core/settings/database.py)
  DATABASE_URL: ${DATABASE_URL:-}
  DB_NAME: ${DB_NAME:-dts_delivery}
  DB_USER: ${DB_USER:-postgres}
  DB_PASSWORD: ${DB_PASSWORD:-postgres}
  DB_HOST: ${DB_HOST:-db}
  DB_PORT: ${DB_PORT:-5432}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
  EMAIL_HOST: mailpit
  EMAIL_PORT: "1025"
  EMAIL_USE_TLS: "False"
  EMAIL_USE_SSL: "False"
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@dts.local}
  FCM_CREDENTIALS_PATH: ${FCM_CREDENTIALS_PATH:-}
  RUN_MIGRATIONS: "false"
  SERVE_MEDIA: ${SERVE_MEDIA:-True}
  MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-http://extreme.local:8000}
  # Valor fijo: no usar ${MEDIA_ROOT} del .env (una línea vacía lo anula).
  MEDIA_ROOT: /app/backend/media

x-backend-build: &backend-build
  context: ..
  dockerfile: docker-infrastructure/backend/Dockerfile

services:
  api:
    build: *backend-build
    container_name: dts-api
    command: >
      uv run gunicorn core.wsgi:application
      --bind 0.0.0.0:8000
      --workers ${GUNICORN_WORKERS:-2}
      --timeout ${GUNICORN_TIMEOUT:-120}
      --access-logfile -
      --error-logfile -
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "true"
      MEDIA_ROOT: /app/backend/media
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - backend_media:/app/backend/media
      - ${FCM_CREDENTIALS_HOST_PATH:-./volumes/fcm}:/secrets/fcm:ro
    depends_on:
      db:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/v1/docs/ > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s
    networks:
      - dts-backend
    restart: unless-stopped

  celery-worker:
    build: *backend-build
    container_name: dts-celery-worker
    command: >
      uv run celery -A core worker
      --loglevel=${CELERY_LOG_LEVEL:-info}
      --concurrency=${CELERY_CONCURRENCY:-2}
    environment:
      <<: *backend-env
    volumes:
      - ${FCM_CREDENTIALS_HOST_PATH:-./volumes/fcm}:/secrets/fcm:ro
    depends_on:
      db:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - dts-backend
    restart: unless-stopped

  # Uso: make backend-migrate-docker (no requiere GDAL en el host)
  backend-migrate:
    build: *backend-build
    profiles: [tools]
    command: uv run python manage.py migrate --noinput
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "false"
    depends_on:
      db:
        condition: service_healthy
        required: false
    networks:
      - dts-backend

  celery-beat:
    build: *backend-build
    container_name: dts-celery-beat
    command: >
      uv run celery -A core beat
      --loglevel=${CELERY_LOG_LEVEL:-info}
      --schedule /tmp/celerybeat-schedule
    environment:
      <<: *backend-env
    volumes:
      - celery_beat_data:/tmp
      - ${FCM_CREDENTIALS_HOST_PATH:-./volumes/fcm}:/secrets/fcm:ro
    depends_on:
      db:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - dts-backend
    restart: unless-stopped

volumes:
  celery_beat_data:
  backend_media:
