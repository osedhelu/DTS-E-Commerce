name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: test_dts
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test_dts"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GDAL/GEOS (PostGIS)
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev libgeos-dev

      - name: Install backend deps
        working-directory: backend
        run: uv sync

      - name: Verify GDAL bindings
        working-directory: backend
        run: uv run python -c "from django.contrib.gis.gdal import GDAL_VERSION; print('GDAL', GDAL_VERSION)"
        env:
          DJANGO_SETTINGS_MODULE: core.settings.test
          GDAL_LIBRARY_PATH: /usr/lib/x86_64-linux-gnu/libgdal.so
          GEOS_LIBRARY_PATH: /usr/lib/x86_64-linux-gnu/libgeos_c.so

      - name: Backend tests
        working-directory: backend
        run: uv run pytest -v
        env:
          DJANGO_SETTINGS_MODULE: core.settings.test
          CI: "true"
          POSTGRES_DB: test_dts
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          GDAL_LIBRARY_PATH: /usr/lib/x86_64-linux-gnu/libgdal.so
          GEOS_LIBRARY_PATH: /usr/lib/x86_64-linux-gnu/libgeos_c.so

  flutter-customer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: flutter-customer
      - run: flutter analyze
        working-directory: flutter-customer
      - run: flutter test
        working-directory: flutter-customer

  flutter-driver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: flutter-driver
      - run: flutter analyze
        working-directory: flutter-driver
      - run: flutter test
        working-directory: flutter-driver

  web-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web-admin/package-lock.json
      - run: npm ci
        working-directory: web-admin
      - run: npm run lint
        working-directory: web-admin
      - run: npm run build
        working-directory: web-admin
